<!DOCTYPE html>
<html lang="es" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso · Sistema de Control de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/estilos.css') }}" rel="stylesheet">
</head>
<body>

<div class="acceso">
    <div class="acceso-caja">

        <div class="mb-4">
            <i class="bi bi-boxes fs-2" style="color: var(--acento);"></i>
            <h1 class="titulo-pagina mt-2 mb-1">Sistema de Control de Inventario</h1>
            <p class="bajada">Identifícate para continuar.</p>
        </div>

        {% for categoria, mensaje in get_flashed_messages(with_categories=true) %}
            <div class="alert alert-{{ categoria }} py-2 small">{{ mensaje }}</div>
        {% endfor %}

        <div class="tarjeta">
            <div class="tarjeta-cuerpo">
                <form method="post" action="{{ url_for('login') }}">
                    <div class="mb-3">
                        <label class="form-label small fw-semibold" for="usuario">Usuario</label>
                        <input class="form-control" id="usuario" name="usuario"
                               value="{{ usuario }}" required autofocus autocomplete="username">
                    </div>

                    <div class="mb-4">
                        <label class="form-label small fw-semibold" for="clave">Contraseña</label>
                        <input class="form-control" id="clave" name="clave"
                               type="password" required autocomplete="current-password">
                    </div>

                    <button class="btn w-100 text-white"
                            style="background-color: var(--acento);" type="submit">
                        Entrar
                    </button>
                </form>
            </div>
        </div>

        <p class="sub mt-3 mb-1">Usuarios de demostración</p>
        <div class="tarjeta">
            <table class="table tabla small mb-0">
                <tbody>
                    <tr>
                        <td class="codigo">laura · 1234</td>
                        <td class="sub">Encargada: registra movimientos</td>
                    </tr>
                    <tr>
                        <td class="codigo">admin · 1234</td>
                        <td class="sub">Administrador: además gestiona el catálogo</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
