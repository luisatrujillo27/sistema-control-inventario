<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Inventario - Supermercado</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- SweetAlert2 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <style>
        /* PALETA MODO OSCURO - CELESTE */
        :root {
            --bs-primary: #0ea5e9; 
        }

        /* FONDO GEOMÉTRICO DISCRETO */
        body {
            --size: 60px; 
            --color: #0B1120; 
            
            --l: var(--color) 20%, #0000 0;
            --bg: 35%, #0F172A 0 45%, var(--color) 0; 
            
            background: linear-gradient(
                45deg,
                var(--l) 45%,
                var(--color) 0 70%,
                #0000 0
              ),
              linear-gradient(-45deg, var(--l) var(--bg) 70%, #0000 0),
              linear-gradient(45deg, var(--color) var(--bg)) !important;
            background-size: var(--size) var(--size) !important;
            
            color: #F8FAFC !important;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            /* Necesario para las notificaciones absolutas */
            position: relative;
            overflow-x: hidden; 
        }

        .card {
            background-color: #1E293B !important; 
            border: 1px solid #334155 !important; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5) !important; 
        }

        .card-header {
            border-bottom: 1px solid #334155 !important;
            background-color: transparent !important;
        }

        /* --- SISTEMA DE ALERTAS ANIMADAS --- */
        #contenedor-alertas {
            position: fixed;
            bottom: 20px;
            left: 20px; /* Posicionado a la izquierda */
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none; /* Para que no bloquee clics detrás */
        }

        .alerta-restock {
            background-color: rgba(220, 38, 38, 0.95); /* Rojo oscuro semitransparente */
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 4px solid #f87171;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 300px;
            font-weight: 500;
            /* ANIMACIÓN DE ENTRADA: 0.9s desde la izquierda */
            animation: slideInLeft 0.9s ease-out forwards;
        }

        .alerta-restock.saliendo {
            /* ANIMACIÓN DE SALIDA */
            animation: fadeOutLeft 0.5s ease-in forwards;
        }

        @keyframes slideInLeft {
            0% {
                transform: translateX(-120%); /* Fuera de pantalla a la izquierda */
                opacity: 0;
            }
            100% {
                transform: translateX(0); /* Posición final */
                opacity: 1;
            }
        }

        @keyframes fadeOutLeft {
            0% {
                transform: translateX(0);
                opacity: 1;
            }
            100% {
                transform: translateX(-120%);
                opacity: 0;
            }
        }
        /* ------------------------------------------- */

        /* FILTROS */
        .btn-filtro {
            border-radius: 50px;
            padding: 0.375rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            border: 1px solid #334155;
            background-color: #0F172A;
            color: #94A3B8;
            transition: all 0.2s ease;
        }
        .btn-filtro:hover {
            background-color: #1E293B;
            color: #F8FAFC;
        }
        .btn-filtro.active {
            background-color: #0ea5e9;
            color: white;
            border-color: #0ea5e9;
            box-shadow: 0 4px 6px -1px rgba(14, 165, 233, 0.3);
        }

        /* TABLA */
        .table {
            --bs-table-bg: transparent;
            --bs-table-color: #E2E8F0;
            --bs-table-border-color: #334155;
        }
        .table thead th {
            background-color: #0F172A !important; 
            color: #94A3B8 !important; 
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #334155;
        }
        
        .table .stock-critico td {
            background-color: rgba(220, 38, 38, 0.15) !important;
            color: #fca5a5 !important;
        }

        /* FORMULARIOS */
        .form-label {
            color: #94A3B8; 
        }
        .form-control, .form-select {
            background-color: #0F172A; 
            border: 1px solid #334155;
            color: #E2E8F0;
        }
        .form-control:focus, .form-select:focus {
            background-color: #0F172A;
            border-color: #0ea5e9; 
            box-shadow: 0 0 0 0.25rem rgba(14, 165, 233, 0.25);
            color: #ffffff;
        }
        .caja-radios {
            background-color: #0F172A;
            border: 1px solid #334155;
        }

        /* BOTÓN UIVERSE GUARDAR */
        .button-uiverse {
            background-color: transparent;
            color: #fff;
            width: 100%; 
            height: 3em;
            border: #0ea5e9 0.2em solid; 
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px; 
            transition: all 0.6s ease;
            cursor: pointer;
            padding: 0;
        }

        .button-uiverse:hover {
            background-color: #0ea5e9; 
        }

        .button-uiverse svg {
            width: 1.6em;
            height: 1.6em; 
            transition: all 0.6s ease;
        }

        .button-uiverse:hover svg {
            transform: translateX(6px); 
        }

        .button-uiverse .text {
            font-size: 16px;
            font-weight: 600;
            margin: 0; 
        }

        /* BOTÓN UIVERSE REINICIAR */
        .styled-wrapper .button-reset {
            display: block;
            position: relative;
            width: 150px; 
            height: 40px;
            margin: 0;
            overflow: hidden;
            outline: none;
            background-color: transparent;
            cursor: pointer;
            border: 0;
            border-radius: 50px; 
        }

        .styled-wrapper .button-reset:before {
            content: "";
            position: absolute;
            border-radius: 50px;
            inset: 0px;
            border: 2px solid #94A3B8; 
            transition: opacity 0.4s cubic-bezier(0.77, 0, 0.175, 1) 80ms, transform 0.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) 80ms;
        }

        .styled-wrapper .button-reset:after {
            content: "";
            position: absolute;
            border-radius: 50px;
            inset: 0px;
            border: 2px solid #0ea5e9; 
            transform: scale(1.1);
            transition: opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            opacity: 0;
        }

        .styled-wrapper .button-reset:hover:before, .styled-wrapper .button-reset:focus:before {
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.4s cubic-bezier(0.165, 0.84, 0.44, 1), transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .styled-wrapper .button-reset:hover:after, .styled-wrapper .button-reset:focus:after {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.4s cubic-bezier(0.77, 0, 0.175, 1) 80ms, transform 0.5s cubic-bezier(0.455, 0.03, 0.515, 0.955) 80ms;
        }

        .styled-wrapper .button-box {
            display: flex;
            position: absolute;
            top: 0;
            left: 0;
            width: 300px; 
            height: 100%;
        }

        .styled-wrapper .button-elem {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 150px;
            height: 100%;
            margin: 0; 
            font-size: 14px;
            font-weight: 600;
            color: #94A3B8; 
            letter-spacing: 0.5px;
        }

        .styled-wrapper .button-elem:nth-child(2) {
            color: #0ea5e9;
        }

        .styled-wrapper .button-reset:hover .button-box, .styled-wrapper .button-reset:focus .button-box {
            transition: 0.4s;
            transform: translateX(-150px); 
        }
    </style>
</head>
<body>

    <!-- Contenedor para las alertas animadas -->
    <div id="contenedor-alertas"></div>

    <!-- Barra de Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow" style="background-color: #0ea5e9;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Gestor de Inventario</a>
        </div>
    </nav>

    <div class="container pb-4">
        <div class="row">
            <!-- Sección de la Tabla -->
            <div class="col-lg-8 mb-4">
                <div class="card border-0 rounded-4">
                    <div class="card-header d-flex flex-wrap justify-content-between align-items-center py-3 gap-3">
                        <h5 class="mb-0 fw-bold text-white">Estado del Inventario</h5>
                        
                        <!-- BOTÓN UIVERSE REINICIAR -->
                        <div class="styled-wrapper">
                            <button class="button-reset" onclick="reiniciarInventario()">
                                <div class="button-box">
                                    <span class="button-elem">Reiniciar Datos</span>
                                    <span class="button-elem">Reiniciar Datos</span>
                                </div>
                            </button>
                        </div>
                    </div>
                    
                    <!-- BARRA DE FILTROS -->
                    <div class="card-body border-bottom border-secondary-subtle py-2 bg-dark bg-opacity-25 d-flex gap-2 align-items-center">
                        <span class="text-secondary fw-semibold small me-2"><i class="bi bi-funnel"></i> Filtrar:</span>
                        <button class="btn btn-filtro active" data-filter="todos" onclick="filtrarTabla('todos', this)">Todos</button>
                        <button class="btn btn-filtro" data-filter="optimo" onclick="filtrarTabla('optimo', this)">Óptimo</button>
                        <button class="btn btn-filtro" data-filter="regular" onclick="filtrarTabla('regular', this)">Regular</button>
                        <button class="btn btn-filtro" data-filter="critico" onclick="filtrarTabla('critico', this)">Bajo Stock</button>
                    </div>

                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0" id="tabla-inventario">
                                <thead>
                                    <tr>
                                        <th class="ps-4">ID</th>
                                        <th>Producto</th>
                                        <th class="text-center">Existencias</th>
                                        <th class="text-center">Stock Mínimo</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="cuerpo-tabla">
                                    <!-- Datos de JS -->
                                </tbody>
                            </table>
                            <!-- Mensaje de tabla vacía -->
                            <div id="mensaje-vacio" class="text-center py-4 text-secondary d-none">
                                <i class="bi bi-inbox fs-2 mb-2 d-block"></i>
                                <p class="mb-0">No hay productos en este estado.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Sección del Formulario -->
            <div class="col-lg-4">
                <div class="card border-0 rounded-4">
                    <div class="card-header py-3">
                        <h5 class="mb-0 fw-bold text-white">Registrar Movimiento</h5>
                    </div>
                    <div class="card-body">
                        <form id="form-movimiento">
                            <div class="mb-3">
                                <label for="productoSelect" class="form-label fw-semibold">Producto</label>
                                <select class="form-select" id="productoSelect" required>
                                    <option value="" selected disabled>Seleccione un producto...</option>
                                    <option value="001">Arroz Blanco (1kg)</option>
                                    <option value="002">Aceite Vegetal (1L)</option>
                                    <option value="003">Leche Entera (1L)</option>
                                    <option value="004">Frijol Cargamanto (500g)</option>
                                </select>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold">Tipo de Movimiento</label>
                                <div class="caja-radios d-flex gap-4 p-3 rounded-3">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tipoMov" id="movEntrada" value="entrada" checked>
                                        <label class="form-check-label text-success fw-bold" for="movEntrada">
                                            <i class="bi bi-arrow-up-circle"></i> Entrada
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="tipoMov" id="movSalida" value="salida">
                                        <label class="form-check-label text-danger fw-bold" for="movSalida">
                                            <i class="bi bi-arrow-down-circle"></i> Salida
                                        </label>
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="cantidadInput" class="form-label fw-semibold">Cantidad</label>
                                <input type="number" class="form-control" id="cantidadInput" min="1" placeholder="Ej. 10" required>
                            </div>

                            <!-- BOTÓN UIVERSE GUARDAR -->
                            <div class="d-grid mt-4">
                                <button type="submit" class="button-uiverse">
                                    <div class="text">Guardar Movimiento</div>
                                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                                        <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12h15m0 0l-6.75-6.75M19.5 12l-6.75 6.75"></path>
                                    </svg>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- SCRIPT -->
    <script>
        const inventarioInicial = [
            { id: "001", nombre: "Arroz Blanco (1kg)", existencias: 150, minimo: 50 },
            { id: "002", nombre: "Aceite Vegetal (1L)", existencias: 85, minimo: 30 },
            { id: "003", nombre: "Leche Entera (1L)", existencias: 12, minimo: 20 },
            { id: "004", nombre: "Frijol Cargamanto (500g)", existencias: 40, minimo: 25 }
        ];

        let filtroActual = 'todos'; 

        // Función para mostrar la alerta animada (Desliza desde la izquierda en 0.9s)
        function mostrarAlertaRestock(nombreProducto, existencias) {
            const contenedor = document.getElementById('contenedor-alertas');
            const alerta = document.createElement('div');
            alerta.className = 'alerta-restock';
            // --- AQUÍ ESTÁ EL CAMBIO SOLICITADO ---
            alerta.innerHTML = `
                <i class="bi bi-exclamation-triangle-fill fs-4"></i>
                <div>
                    <div class="small text-white-50">Producto Bajo de Stock</div>
                    <div>${nombreProducto} (${existencias} unid.)</div>
                </div>
            `;
            
            contenedor.appendChild(alerta);

            // Eliminar la alerta después de 5 segundos
            setTimeout(() => {
                alerta.classList.add('saliendo'); // Activa la animación de salida
                // Esperar a que termine la animación de salida para borrarla del HTML
                setTimeout(() => {
                    alerta.remove();
                }, 500);
            }, 5000);
        }

        function cargarDatos() {
            let datosGuardados = localStorage.getItem('miInventario');
            if (!datosGuardados) {
                localStorage.setItem('miInventario', JSON.stringify(inventarioInicial));
                datosGuardados = localStorage.getItem('miInventario');
            }
            dibujarTabla(JSON.parse(datosGuardados));
        }

        function dibujarTabla(datos) {
            const cuerpoTabla = document.getElementById('cuerpo-tabla');
            const mensajeVacio = document.getElementById('mensaje-vacio');
            cuerpoTabla.innerHTML = ''; 
            
            let itemsMostrados = 0;

            datos.forEach(producto => {
                let badge = '';
                let claseFila = '';
                let estadoFiltro = ''; 

                if (producto.existencias <= producto.minimo) {
                    badge = '<span class="badge bg-danger rounded-pill">Bajo Stock</span>';
                    claseFila = 'stock-critico';
                    estadoFiltro = 'critico';
                } else if (producto.existencias <= producto.minimo + 15) {
                    badge = '<span class="badge bg-warning text-dark rounded-pill">Regular</span>';
                    estadoFiltro = 'regular';
                } else {
                    badge = '<span class="badge bg-success rounded-pill">Óptimo</span>';
                    estadoFiltro = 'optimo';
                }

                if (filtroActual === 'todos' || filtroActual === estadoFiltro) {
                    cuerpoTabla.innerHTML += `
                        <tr class="${claseFila}">
                            <td class="ps-4 fw-bold" style="color: #94A3B8;">${producto.id}</td>
                            <td class="fw-semibold text-white">${producto.nombre}</td>
                            <td class="existencia-val text-center text-white">${producto.existencias}</td>
                            <td class="text-center text-white">${producto.minimo}</td>
                            <td>${badge}</td>
                        </tr>
                    `;
                    itemsMostrados++;
                }
            });

            if (itemsMostrados === 0) {
                mensajeVacio.classList.remove('d-none');
            } else {
                mensajeVacio.classList.add('d-none');
            }
        }

        function filtrarTabla(estado, botonClickeado) {
            filtroActual = estado;
            document.querySelectorAll('.btn-filtro').forEach(btn => btn.classList.remove('active'));
            botonClickeado.classList.add('active');
            let datosActuales = JSON.parse(localStorage.getItem('miInventario'));
            dibujarTabla(datosActuales);
        }

        document.getElementById('form-movimiento').addEventListener('submit', function(e) {
            e.preventDefault();

            const productoId = document.getElementById('productoSelect').value;
            const tipoMov = document.querySelector('input[name="tipoMov"]:checked').value;
            const cantidadIngresada = parseInt(document.getElementById('cantidadInput').value);

            let datosActuales = JSON.parse(localStorage.getItem('miInventario'));
            let productoIndex = datosActuales.findIndex(p => p.id === productoId);
            let productoSeleccionado = datosActuales[productoIndex];

            // Guardamos el estado ANTES del movimiento
            const estabaCritico = productoSeleccionado.existencias <= productoSeleccionado.minimo;

            if (tipoMov === 'entrada') {
                productoSeleccionado.existencias += cantidadIngresada;
            } else if (tipoMov === 'salida') {
                if (cantidadIngresada > productoSeleccionado.existencias) {
                    Swal.fire({
                        icon: 'error',
                        title: 'Stock Insuficiente',
                        text: `Solo hay ${productoSeleccionado.existencias} unidades de ${productoSeleccionado.nombre}.`,
                        background: '#1E293B',
                        color: '#F8FAFC',
                        confirmButtonColor: '#0ea5e9'
                    });
                    return; 
                }
                productoSeleccionado.existencias -= cantidadIngresada;
            }

            // Comprobamos el estado DESPUÉS del movimiento
            const estaCriticoAhora = productoSeleccionado.existencias <= productoSeleccionado.minimo;

            // Disparamos la alerta si el producto acaba de entrar en estado crítico
            if (tipoMov === 'salida' && !estabaCritico && estaCriticoAhora) {
                mostrarAlertaRestock(productoSeleccionado.nombre, productoSeleccionado.existencias);
            }

            localStorage.setItem('miInventario', JSON.stringify(datosActuales));
            dibujarTabla(datosActuales);

            Swal.fire({
                icon: 'success',
                title: '¡Movimiento Registrado!',
                text: `Se registró una ${tipoMov} de ${cantidadIngresada} unidades para ${productoSeleccionado.nombre}.`,
                showConfirmButton: false,
                timer: 2000,
                background: '#1E293B',
                color: '#F8FAFC',
                iconColor: '#0ea5e9'
            });

            this.reset();
        });

        function reiniciarInventario() {
            localStorage.removeItem('miInventario');
            location.reload();
        }

        cargarDatos();
    </script>
</body>
</html>
